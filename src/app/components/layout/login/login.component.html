<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-4">
            <div class="logo-container text-center">
                <img src="assets/img/logo.png" alt="Logo" />
            </div>
            <form (ngSubmit)="logar()">
                <div class="form-group">
                    <label for="login">Usuário</label>
                    <input type="text" id="login" name="login" class="form-control" [(ngModel)]="login.username" placeholder="Digite o seu usuário" />
                    <small class="text-muted">Utilize qualquer usuário e senha para a demo</small>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" [(ngModel)]="login.password" placeholder="Digite a sua senha" />
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <div class="mt-3">
                        <a routerLink="/register" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
