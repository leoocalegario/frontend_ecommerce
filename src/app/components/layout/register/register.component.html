<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-4 text-center">
            <div class="logo-container">
                <img src="assets/img/logo.png" alt="Logo" />
            </div>
            <form (ngSubmit)="registrar()">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" class="form-control" [(ngModel)]="register.username" placeholder="Digite o seu usuário" required />
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-control" [(ngModel)]="register.password" placeholder="Digite a sua senha" required />
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" [(ngModel)]="register.confirmPassword" placeholder="Confirme a sua senha" required />
                </div>
                @if(errorMessage){
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ errorMessage }}
                    </div>
                }
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <div class="mt-3">
                    <a routerLink="/login" class="text-decoration-none">Já tem uma conta? Faça login</a>
                </div>
            </form>
        </div>
    </div>
</div>
